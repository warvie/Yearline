# Builds an unsigned Yearline.ipa on a free GitHub Mac, for sideloading with a free Apple ID (Sideloadly or AltStore).
# Run it from the repo's Actions tab ("Build iPhone app" > Run workflow), then download "Yearline-ipa" from the finished run.
name: Build iPhone app

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # SDK 58 needs Xcode 27 (the iOS 27 SDK).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Generates the ios/ folder from app.json and installs its pods.
      - run: npx expo prebuild --platform ios --clean

      # Release build with the JS bundled in, no signing (the sideloading tool signs it with your Apple ID).
      - name: Build
        working-directory: ios
        shell: bash
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 60

      - name: Package .ipa
        run: |
          APP=$(ls -d ios/build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry Yearline.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Yearline-ipa
          path: Yearline.ipa
